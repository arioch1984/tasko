name: tasko
description: Improved Google Tasks interface with labels, priority, and Tasko the badger.
publish_to: "none"
version: 0.3.0+5
environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  google_sign_in: ^6.2.2
  http: ^1.3.0
  shared_preferences: ^2.5.2
  flutter_secure_storage: ^9.2.4
  intl: ^0.20.2
  collection: ^1.19.0
  equatable: ^2.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/mascot/
    - assets/icon/
