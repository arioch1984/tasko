name: Prepare release PR

# After work lands on develop, open or refresh a PR into main with the
# version bump, changelog, and AppConstants needed to publish.

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: prepare-release-pr
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare:
    name: Open or update PR to main
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Test release script
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'

      - name: Fetch main
        run: git fetch origin main

      - name: Compute release
        id: prep
        run: |
          set -euo pipefail
          python3 .github/scripts/prepare_release.py \
            --github-output "$GITHUB_OUTPUT" \
            --body-file "$RUNNER_TEMP/release-pr-body.md"

      - name: Nothing to ship
        if: steps.prep.outputs.skip == 'true'
        run: echo "${{ steps.prep.outputs.reason }}"

      - name: Push release branch and upsert PR
        if: steps.prep.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.prep.outputs.version }}
          BRANCH: ${{ steps.prep.outputs.branch }}
          TITLE: ${{ steps.prep.outputs.title }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add pubspec.yaml lib/core/constants.dart CHANGELOG.md
          if git diff --cached --quiet; then
            echo "Release files unchanged"
          else
            git commit -m "Release v${VERSION}."
          fi
          git push -u origin "$BRANCH" --force
          BODY_FILE="$RUNNER_TEMP/release-pr-body.md"
          EXISTING="$(gh pr list --base main --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [[ -n "$EXISTING" ]]; then
            gh pr edit "$EXISTING" --title "$TITLE" --body-file "$BODY_FILE"
            exit 0
          fi
          for pr in $(gh pr list --base main --state open --json number,headRefName --jq '.[] | select(.headRefName|startswith("release/v")) | .number'); do
            gh pr close "$pr" --comment "Superseded by ${BRANCH}."
          done
          if gh pr create --base main --head "$BRANCH" --title "$TITLE" --body-file "$BODY_FILE"; then
            exit 0
          fi
          echo "::error::GitHub Actions could not open the release PR."
          echo "Enable: Settings → Actions → General → Workflow permissions"
          echo "  1. Read and write"
          echo "  2. Allow GitHub Actions to create and approve pull requests"
          echo "Then open: https://github.com/${GITHUB_REPOSITORY}/compare/main...${BRANCH}?expand=1"
          exit 1
