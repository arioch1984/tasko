name: Release

on:
  push:
    tags:
      - "v*"
    branches:
      - main

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  tag:
    name: Tag from main
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create tag if unpublished
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="$(grep -E '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)"
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "GitHub Release $TAG already exists; not tagging."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin --tags
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            git push origin "$TAG" || true
          else
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
          fi

  sync-develop:
    name: Sync main into develop
    if: github.ref == 'refs/heads/main'
    needs: [tag]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge main into develop
        run: |
          set -euo pipefail
          VERSION="$(grep -E '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)"
          TAG="v${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin develop
          git checkout develop
          if git merge origin/main -m "Sync ${TAG} into develop."; then
            git push origin develop
          else
            git merge --abort || true
            BRANCH="sync/${TAG}"
            git checkout -B "$BRANCH" origin/main
            git push -u origin "$BRANCH" --force
            EXISTING="$(gh pr list --base develop --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"
            if [[ -z "$EXISTING" ]]; then
              gh pr create --base develop --head "$BRANCH" --title "Sync ${TAG} into develop" \
                --body "Bring the ${TAG} version bump and changelog back onto \`develop\` after the GitHub Release."
            fi
          fi

  # GITHUB_TOKEN tag pushes do not start a second workflow. Build in this
  # run when merging to main; a human-pushed v* tag still works as fallback.
  meta:
    name: Release metadata
    needs: [tag]
    if: |
      always() && !cancelled() && (
        startsWith(github.ref, 'refs/tags/v') ||
        (github.ref == 'refs/heads/main' && needs.tag.result == 'success')
      )
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      apk: ${{ steps.meta.outputs.apk }}
      zip: ${{ steps.meta.outputs.zip }}
      exists: ${{ steps.meta.outputs.exists }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: meta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PUBSPEC="$(grep -E '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#v}"
            if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Tag $TAG is not a vX.Y.Z version tag"
              exit 1
            fi
            if [[ "$PUBSPEC" != "$VERSION" ]]; then
              echo "pubspec.yaml version $PUBSPEC does not match tag $VERSION"
              exit 1
            fi
          else
            VERSION="$PUBSPEC"
            TAG="v${VERSION}"
            if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "pubspec.yaml version $VERSION is not X.Y.Z"
              exit 1
            fi
          fi
          EXISTS=false
          if gh release view "$TAG" >/dev/null 2>&1; then
            EXISTS=true
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "apk=tasko-${VERSION}.apk" >> "$GITHUB_OUTPUT"
          echo "zip=tasko-${VERSION}-macos.zip" >> "$GITHUB_OUTPUT"
          echo "exists=$EXISTS" >> "$GITHUB_OUTPUT"

  android:
    name: Build Android APK
    needs: [meta]
    if: always() && !cancelled() && needs.meta.result == 'success' && needs.meta.outputs.exists != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses >/dev/null 2>&1 || true

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "${ANDROID_KEYSTORE_BASE64:-}" ]]; then
            echo "Missing secret ANDROID_KEYSTORE_BASE64"
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/keystore.jks
          test -s android/app/keystore.jks

      - name: Install dependencies
        run: flutter pub get

      - name: Test
        run: flutter test

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/app/keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ vars.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [[ -z "${ANDROID_KEYSTORE_PASSWORD:-}" || -z "${ANDROID_KEY_PASSWORD:-}" || -z "${ANDROID_KEY_ALIAS:-}" ]]; then
            echo "Missing ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_PASSWORD, or ANDROID_KEY_ALIAS"
            exit 1
          fi
          flutter build apk --release

      - name: Package APK
        run: |
          set -euo pipefail
          APK="${{ needs.meta.outputs.apk }}"
          SRC="build/app/outputs/flutter-apk/app-release.apk"
          test -f "$SRC"
          cp "$SRC" "$APK"
          python3 .github/scripts/apk_signing_cert.py "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: ${{ needs.meta.outputs.apk }}
          if-no-files-found: error

  macos:
    name: Build macOS zip
    needs: [meta]
    if: always() && !cancelled() && needs.meta.result == 'success' && needs.meta.outputs.exists != 'true'
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build macOS release
        env:
          TASKO_MACOS_GOOGLE_CLIENT_ID: ${{ vars.TASKO_MACOS_GOOGLE_CLIENT_ID }}
        run: flutter build macos --release --dart-define=TASKO_MACOS_GOOGLE_CLIENT_ID="${TASKO_MACOS_GOOGLE_CLIENT_ID:-}"

      - name: Zip app
        run: |
          set -euo pipefail
          ZIP="${{ needs.meta.outputs.zip }}"
          APP="$(find build/macos -path '*/Release/*.app' -maxdepth 6 | head -n 1)"
          test -n "$APP"
          test -d "$APP"
          ditto -c -k --keepParent "$APP" "$ZIP"
          test -s "$ZIP"

      - name: Upload zip
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: ${{ needs.meta.outputs.zip }}
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [meta, android, macos]
    if: always() && !cancelled() && needs.meta.result == 'success' && needs.meta.outputs.exists != 'true' && needs.android.result == 'success' && needs.macos.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: apk

      - name: Download macOS zip
        uses: actions/download-artifact@v4
        with:
          name: macos

      - name: Notes
        run: python3 .github/scripts/release_notes.py "${{ needs.meta.outputs.version }}" release-notes.md

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "${{ needs.meta.outputs.tag }}" \
            "${{ needs.meta.outputs.apk }}" \
            "${{ needs.meta.outputs.zip }}" \
            --title "${{ needs.meta.outputs.tag }}" \
            --notes-file release-notes.md
